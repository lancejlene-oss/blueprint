<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">ROOF PLAN AND SECTION</text>
  
  <!-- ROOF PLAN (Top Half) -->
  <text x="220" y="60" font-family="Arial" font-size="14" font-weight="bold">ROOF PLAN VIEW</text>
  
  <!-- Building outline -->
  <rect x="50" y="80" width="400" height="280" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Ridge line -->
  <line x1="50" y1="220" x2="450" y2="220" stroke="#ff0000" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="460" y="224" font-family="Arial" font-size="10" fill="#ff0000">Ridge</text>
  
  <!-- Hip lines -->
  <line x1="50" y1="80" x2="250" y2="220" stroke="#0000ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="450" y1="80" x2="250" y2="220" stroke="#0000ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="50" y1="360" x2="250" y2="220" stroke="#0000ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="450" y1="360" x2="250" y2="220" stroke="#0000ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="150" y="140" font-family="Arial" font-size="9" fill="#0000ff">Hip</text>
  
  <!-- Valley (if applicable) -->
  <line x1="350" y1="80" x2="350" y2="220" stroke="#00aa00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="355" y="145" font-family="Arial" font-size="9" fill="#00aa00">Valley</text>
  
  <!-- Eave lines -->
  <line x1="50" y1="80" x2="450" y2="80" stroke="#000" stroke-width="1"/>
  <line x1="50" y1="360" x2="450" y2="360" stroke="#000" stroke-width="1"/>
  <line x1="50" y1="80" x2="50" y2="360" stroke="#000" stroke-width="1"/>
  <line x1="450" y1="80" x2="450" y2="360" stroke="#000" stroke-width="1"/>
  
  <!-- Overhang dimensions -->
  <g>
    <line x1="450" y1="70" x2="470" y2="70" stroke="#000" stroke-width="0.5"/>
    <line x1="450" y1="65" x2="450" y2="75" stroke="#000" stroke-width="0.5"/>
    <line x1="470" y1="65" x2="470" y2="75" stroke="#000" stroke-width="0.5"/>
    <text x="460" y="65" font-family="Arial" font-size="9" text-anchor="middle">12"</text>
    <text x="460" y="90" font-family="Arial" font-size="8" text-anchor="middle">Overhang</text>
  </g>
  
  <!-- Roof slope indicators -->
  <g>
    <circle cx="320" cy="150" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="150" x2="330" y2="150" stroke="#000" stroke-width="1"/>
    <text x="320" y="145" font-family="Arial" font-size="9" text-anchor="middle">6</text>
    <text x="320" y="156" font-family="Arial" font-size="9" text-anchor="middle">12</text>
  </g>
  
  <!-- Dimensions -->
  <g>
    <line x1="50" y1="380" x2="450" y2="380" stroke="#000" stroke-width="0.5"/>
    <line x1="50" y1="375" x2="50" y2="385" stroke="#000" stroke-width="0.5"/>
    <line x1="450" y1="375" x2="450" y2="385" stroke="#000" stroke-width="0.5"/>
    <text x="250" y="395" font-family="Arial" font-size="11" text-anchor="middle">40'-0" Building Width</text>
  </g>
  
  <!-- ROOF SECTION (Bottom Half) -->
  <text x="650" y="60" font-family="Arial" font-size="14" font-weight="bold">ROOF SECTION</text>
  <text x="650" y="76" font-family="Arial" font-size="11">(6:12 Pitch)</text>
  
  <!-- Wall section -->
  <rect x="500" y="300" width="15" height="150" fill="#d2b48c" stroke="#000" stroke-width="1"/>
  <rect x="800" y="300" width="15" height="150" fill="#d2b48c" stroke="#000" stroke-width="1"/>
  
  <!-- Top plates -->
  <rect x="500" y="295" width="315" height="5" fill="#d2691e" stroke="#000" stroke-width="1"/>
  
  <!-- Roof deck/sheathing -->
  <line x1="500" y1="295" x2="657" y2="150" stroke="#8b4513" stroke-width="8"/>
  <line x1="815" y1="295" x2="657" y2="150" stroke="#8b4513" stroke-width="8"/>
  
  <!-- Ridge beam -->
  <rect x="654" y="140" width="6" height="10" fill="#8b4513" stroke="#000" stroke-width="1"/>
  <text x="670" y="148" font-family="Arial" font-size="9">Ridge Beam</text>
  
  <!-- Rafters (shown as lighter lines under sheathing) -->
  <line x1="530" y1="295" x2="657" y2="165" stroke="#a0522d" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="600" y1="295" x2="657" y2="185" stroke="#a0522d" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="785" y1="295" x2="657" y2="165" stroke="#a0522d" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="715" y1="295" x2="657" y2="185" stroke="#a0522d" stroke-width="2" stroke-dasharray="3,2"/>
  
  <!-- Overhang -->
  <line x1="500" y1="295" x2="470" y2="320" stroke="#8b4513" stroke-width="8"/>
  <line x1="815" y1="295" x2="845" y2="320" stroke="#8b4513" stroke-width="8"/>
  
  <!-- Fascia -->
  <rect x="467" y="318" width="3" height="25" fill="#654321" stroke="#000" stroke-width="1"/>
  <rect x="845" y="318" width="3" height="25" fill="#654321" stroke="#000" stroke-width="1"/>
  <text x="455" y="355" font-family="Arial" font-size="8">Fascia</text>
  
  <!-- Soffit -->
  <line x1="470" y1="340" x2="500" y2="315" stroke="#c0c0c0" stroke-width="3"/>
  <line x1="845" y1="340" x2="815" y2="315" stroke="#c0c0c0" stroke-width="3"/>
  <text x="480" y="335" font-family="Arial" font-size="8">Soffit</text>
  
  <!-- Pitch triangle diagram -->
  <g transform="translate(550, 500)">
    <text x="80" y="-40" font-family="Arial" font-size="12" font-weight="bold">PITCH DIAGRAM (6:12)</text>
    
    <!-- Horizontal line (run) -->
    <line x1="0" y1="0" x2="120" y2="0" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="-5" x2="120" y2="5" stroke="#000" stroke-width="2"/>
    
    <!-- Vertical line (rise) -->
    <line x1="120" y1="0" x2="120" y2="-60" stroke="#000" stroke-width="2"/>
    <line x1="115" y1="-60" x2="125" y2="-60" stroke="#000" stroke-width="2"/>
    
    <!-- Hypotenuse (slope) -->
    <line x1="0" y1="0" x2="120" y2="-60" stroke="#ff0000" stroke-width="2.5"/>
    
    <!-- Labels -->
    <text x="60" y="15" font-family="Arial" font-size="11" text-anchor="middle">12" RUN</text>
    <text x="135" y="-30" font-family="Arial" font-size="11">6" RISE</text>
    <text x="60" y="-40" font-family="Arial" font-size="11" fill="#ff0000" transform="rotate(-26.57 60 -40)">Slope</text>
    
    <!-- Right angle indicator -->
    <rect x="115" y="-5" width="5" height="5" fill="none" stroke="#000" stroke-width="1"/>
  </g>
  
  <!-- Measurement annotations on section -->
  <g>
    <!-- Overhang dimension -->
    <line x1="500" y1="460" x2="470" y2="460" stroke="#000" stroke-width="0.5"/>
    <line x1="500" y1="455" x2="500" y2="465" stroke="#000" stroke-width="0.5"/>
    <line x1="470" y1="455" x2="470" y2="465" stroke="#000" stroke-width="0.5"/>
    <text x="485" y="475" font-family="Arial" font-size="9" text-anchor="middle">12" Overhang</text>
    
    <!-- Span dimension -->
    <line x1="500" y1="480" x2="815" y2="480" stroke="#000" stroke-width="0.5"/>
    <line x1="500" y1="475" x2="500" y2="485" stroke="#000" stroke-width="0.5"/>
    <line x1="815" y1="475" x2="815" y2="485" stroke="#000" stroke-width="0.5"/>
    <text x="657" y="495" font-family="Arial" font-size="11" text-anchor="middle">26'-0" Span</text>
    
    <!-- Height dimension -->
    <line x1="870" y1="295" x2="870" y2="150" stroke="#000" stroke-width="0.5"/>
    <line x1="865" y1="295" x2="875" y2="295" stroke="#000" stroke-width="0.5"/>
    <line x1="865" y1="150" x2="875" y2="150" stroke="#000" stroke-width="0.5"/>
    <text x="885" y="230" font-family="Arial" font-size="10" transform="rotate(90 885 230)" text-anchor="middle">13'-0" Rise</text>
  </g>
  
  <!-- Notes -->
  <text x="550" y="560" font-family="Arial" font-size="10" font-weight="bold">NOTES:</text>
  <text x="550" y="575" font-family="Arial" font-size="9">• Roof sheathing: 7/16" OSB or 15/32" plywood</text>
  <text x="550" y="590" font-family="Arial" font-size="9">• Slope factor for 6:12 pitch = 1.118</text>
  <text x="550" y="605" font-family="Arial" font-size="9">• Surface area = horizontal area × slope factor</text>
  <text x="550" y="620" font-family="Arial" font-size="9">• Add 10% waste for cuts and starter courses</text>
</svg>
