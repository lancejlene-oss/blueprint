<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">FOUNDATION PLAN AND SECTION</text>
  <text x="450" y="50" font-family="Arial" font-size="12" text-anchor="middle">Slab-on-Grade with Perimeter Footing</text>
  
  <!-- PLAN VIEW (Left side) -->
  <text x="200" y="85" font-family="Arial" font-size="14" font-weight="bold">FOUNDATION PLAN</text>
  
  <!-- Main slab outline -->
  <rect x="50" y="110" width="350" height="250" fill="#d3d3d3" stroke="#000" stroke-width="2"/>
  
  <!-- Perimeter footing (shown as hatched area) -->
  <rect x="40" y="100" width="20" height="270" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
  <rect x="390" y="100" width="20" height="270" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
  <rect x="40" y="100" width="370" height="20" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
  <rect x="40" y="350" width="370" height="20" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
  
  <!-- Hatch pattern definition -->
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Interior beam locations -->
  <line x1="50" y1="235" x2="400" y2="235" stroke="#ff0000" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="225" y="230" font-family="Arial" font-size="11" fill="#ff0000">INTERIOR BEAM</text>
  
  <!-- Pier locations -->
  <circle cx="150" cy="235" r="8" fill="#666" stroke="#000" stroke-width="1.5"/>
  <text x="150" y="255" font-family="Arial" font-size="11" text-anchor="middle">PIER</text>
  
  <circle cx="225" cy="235" r="8" fill="#666" stroke="#000" stroke-width="1.5"/>
  <text x="225" y="255" font-family="Arial" font-size="11" text-anchor="middle">PIER</text>
  
  <circle cx="300" cy="235" r="8" fill="#666" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="255" font-family="Arial" font-size="11" text-anchor="middle">PIER</text>
  
  <!-- Dimensions on plan -->
  <g>
    <line x1="50" y1="390" x2="400" y2="390" stroke="#000" stroke-width="0.5"/>
    <line x1="50" y1="385" x2="50" y2="395" stroke="#000" stroke-width="0.5"/>
    <line x1="400" y1="385" x2="400" y2="395" stroke="#000" stroke-width="0.5"/>
    <text x="225" y="405" font-family="Arial" font-size="11" text-anchor="middle">28'-0"</text>
    
    <line x1="430" y1="110" x2="430" y2="360" stroke="#000" stroke-width="0.5"/>
    <line x1="425" y1="110" x2="435" y2="110" stroke="#000" stroke-width="0.5"/>
    <line x1="425" y1="360" x2="435" y2="360" stroke="#000" stroke-width="0.5"/>
    <text x="445" y="240" font-family="Arial" font-size="11" transform="rotate(90 445 240)" text-anchor="middle">20'-0"</text>
  </g>
  
  <!-- Callouts -->
  <text x="225" y="150" font-family="Arial" font-size="12" text-anchor="middle">4" SLAB</text>
  <line x1="60" y1="110" x2="30" y2="80" stroke="#000" stroke-width="0.5"/>
  <polygon points="30,80 35,83 32,88" fill="#000"/>
  <text x="25" y="80" font-family="Arial" font-size="11" text-anchor="end">Thickened Edge</text>
  <text x="25" y="90" font-family="Arial" font-size="11" text-anchor="end">(Perimeter Footing)</text>
  
  <!-- SECTION VIEW (Right side) -->
  <text x="650" y="85" font-family="Arial" font-size="14" font-weight="bold">SECTION A-A</text>
  
  <!-- Ground/Grade line -->
  <line x1="480" y1="300" x2="820" y2="300" stroke="#654321" stroke-width="3"/>
  <text x="460" y="305" font-family="Arial" font-size="12">GRADE</text>
  
  <!-- Base/subgrade -->
  <rect x="480" y="300" width="340" height="80" fill="#c4a572" stroke="none"/>
  
  <!-- Gravel base -->
  <rect x="500" y="330" width="300" height="20" fill="#808080" stroke="#000" stroke-width="1"/>
  <text x="650" y="343" font-family="Arial" font-size="11" text-anchor="middle">4" GRAVEL BASE</text>
  
  <!-- Vapor barrier (shown as thin line) -->
  <line x1="500" y1="330" x2="800" y2="330" stroke="#0000ff" stroke-width="2"/>
  <text x="830" y="333" font-family="Arial" font-size="11" fill="#0000ff">Vapor Barrier</text>
  
  <!-- Main slab -->
  <rect x="500" y="290" width="300" height="40" fill="#a9a9a9" stroke="#000" stroke-width="2"/>
  <text x="650" y="313" font-family="Arial" font-size="12" text-anchor="middle">4" CONCRETE SLAB</text>
  
  <!-- Rebar in slab (shown as dots) -->
  <circle cx="550" cy="310" r="2" fill="#ff0000"/>
  <circle cx="600" cy="310" r="2" fill="#ff0000"/>
  <circle cx="650" cy="310" r="2" fill="#ff0000"/>
  <circle cx="700" cy="310" r="2" fill="#ff0000"/>
  <circle cx="750" cy="310" r="2" fill="#ff0000"/>
  <text x="830" y="313" font-family="Arial" font-size="11" fill="#ff0000">#3 @ 18" O.C.</text>
  
  <!-- Thickened edge (perimeter footing) -->
  <rect x="480" y="290" width="20" height="60" fill="#a9a9a9" stroke="#000" stroke-width="2"/>
  <rect x="800" y="290" width="20" height="60" fill="#a9a9a9" stroke="#000" stroke-width="2"/>
  
  <!-- Perimeter footing (below grade) -->
  <rect x="470" y="350" width="40" height="30" fill="#808080" stroke="#000" stroke-width="2"/>
  <rect x="790" y="350" width="40" height="30" fill="#808080" stroke="#000" stroke-width="2"/>
  
  <!-- Rebar in footing -->
  <circle cx="490" cy="365" r="3" fill="#ff0000" stroke="#000" stroke-width="1"/>
  <circle cx="490" cy="365" r="3" fill="#ff0000" stroke="#000" stroke-width="1"/>
  <circle cx="810" cy="365" r="3" fill="#ff0000" stroke="#000" stroke-width="1"/>
  <text x="450" y="368" font-family="Arial" font-size="11" fill="#ff0000">(2) #4</text>
  
  <!-- Dimension callouts on section -->
  <g>
    <!-- Slab thickness -->
    <line x1="850" y1="290" x2="850" y2="330" stroke="#ff0000" stroke-width="1"/>
    <line x1="845" y1="290" x2="855" y2="290" stroke="#ff0000" stroke-width="1"/>
    <line x1="845" y1="330" x2="855" y2="330" stroke="#ff0000" stroke-width="1"/>
    <text x="865" y="313" font-family="Arial" font-size="12" fill="#ff0000">4"</text>
    
    <!-- Thickened edge depth -->
    <line x1="450" y1="290" x2="450" y2="350" stroke="#0000ff" stroke-width="1"/>
    <line x1="445" y1="290" x2="455" y2="290" stroke="#0000ff" stroke-width="1"/>
    <line x1="445" y1="350" x2="455" y2="350" stroke="#0000ff" stroke-width="1"/>
    <text x="435" y="323" font-family="Arial" font-size="12" fill="#0000ff">12"</text>
    
    <!-- Footing depth -->
    <line x1="440" y1="300" x2="440" y2="380" stroke="#00aa00" stroke-width="1"/>
    <line x1="435" y1="300" x2="445" y2="300" stroke="#00aa00" stroke-width="1"/>
    <line x1="435" y1="380" x2="445" y2="380" stroke="#00aa00" stroke-width="1"/>
    <text x="425" y="343" font-family="Arial" font-size="12" fill="#00aa00">18"</text>
    
    <!-- Footing width -->
    <line x1="470" y1="395" x2="510" y2="395" stroke="#000" stroke-width="0.5"/>
    <line x1="470" y1="390" x2="470" y2="400" stroke="#000" stroke-width="0.5"/>
    <line x1="510" y1="390" x2="510" y2="400" stroke="#000" stroke-width="0.5"/>
    <text x="490" y="410" font-family="Arial" font-size="11" text-anchor="middle">16"</text>
  </g>
  
  <!-- Labels -->
  <text x="490" y="340" font-family="Arial" font-size="11">Thickened</text>
  <text x="490" y="350" font-family="Arial" font-size="11">Edge</text>
  
  <!-- Pier detail (small inset) - positioned to the right of notes -->
  <g transform="translate(700, 430)">
    <rect x="0" y="0" width="140" height="160" fill="#f5f5f5" stroke="#000" stroke-width="2"/>
    <text x="70" y="18" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">PIER DETAIL</text>
    
    <!-- White background behind pier graphic for clarity -->
    <rect x="35" y="30" width="70" height="110" fill="#ffffff" stroke="none"/>
    
    <!-- Grade line in detail -->
    <line x1="15" y1="60" x2="125" y2="60" stroke="#654321" stroke-width="2"/>
    <text x="8" y="64" font-family="Arial" font-size="11">Grade</text>
    
    <!-- Pier shaft -->
    <rect x="55" y="60" width="30" height="65" fill="#808080" stroke="#000" stroke-width="1.5"/>
    
    <!-- Bell bottom -->
    <path d="M 40 135 L 55 130 L 55 125 L 40 105 Z" fill="#808080" stroke="#000" stroke-width="1.5"/>
    <path d="M 100 135 L 85 130 L 85 125 L 100 105 Z" fill="#808080" stroke="#000" stroke-width="1.5"/>
    <rect x="40" y="130" width="60" height="10" fill="#808080" stroke="#000" stroke-width="1.5"/>
    
    <!-- Rebar -->
    <circle cx="70" cy="85" r="2.5" fill="#ff0000"/>
    <line x1="70" y1="62" x2="70" y2="130" stroke="#ff0000" stroke-width="2"/>
    
    <!-- Dimensions -->
    <line x1="110" y1="60" x2="110" y2="130" stroke="#000" stroke-width="0.5"/>
    <line x1="107" y1="60" x2="113" y2="60" stroke="#000" stroke-width="0.5"/>
    <line x1="107" y1="130" x2="113" y2="130" stroke="#000" stroke-width="0.5"/>
    <text x="120" y="98" font-family="Arial" font-size="12">24"</text>
    
    <line x1="40" y1="148" x2="100" y2="148" stroke="#000" stroke-width="0.5"/>
    <line x1="40" y1="145" x2="40" y2="151" stroke="#000" stroke-width="0.5"/>
    <line x1="100" y1="145" x2="100" y2="151" stroke="#000" stroke-width="0.5"/>
    <text x="70" y="160" font-family="Arial" font-size="12" text-anchor="middle">18" Ø</text>
  </g>
  
  <!-- Notes section -->
  <g transform="translate(480, 450)">
    <text x="0" y="0" font-family="Arial" font-size="12" font-weight="bold">NOTES:</text>
    <text x="0" y="18" font-family="Arial" font-size="12">1. Concrete: 3000 PSI minimum for slab and footings</text>
    <text x="0" y="33" font-family="Arial" font-size="12">2. Rebar: Grade 60, #3 @ 18" O.C. both ways in slab</text>
    <text x="0" y="48" font-family="Arial" font-size="12">3. Perimeter footing: (2) #4 continuous bars</text>
    <text x="0" y="63" font-family="Arial" font-size="12">4. Vapor barrier: 6 mil polyethylene, lap 6" minimum</text>
    <text x="0" y="78" font-family="Arial" font-size="12">5. Gravel base: 4" compacted, 3/4" crushed stone</text>
    <text x="0" y="93" font-family="Arial" font-size="12">6. Piers: 12" diameter min, bell to 18" at base</text>
  </g>
</svg>
