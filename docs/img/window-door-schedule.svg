<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">WINDOW AND DOOR SCHEDULE</text>
  <text x="450" y="50" font-family="Arial" font-size="12" text-anchor="middle">Schedule Table and Plan View Coordination</text>
  
  <!-- SCHEDULE TABLE (Top) -->
  <g transform="translate(50, 80)">
    <text x="0" y="-10" font-family="Arial" font-size="13" font-weight="bold">WINDOW SCHEDULE</text>
    
    <!-- Table header -->
    <rect x="0" y="0" width="800" height="30" fill="#4682b4" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">TAG</text>
    <text x="110" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">QTY</text>
    <text x="210" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">SIZE (W×H)</text>
    <text x="350" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ROUGH OPENING</text>
    <text x="490" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">HEADER SIZE</text>
    <text x="630" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">REMARKS</text>
    
    <!-- Table grid lines -->
    <line x1="80" y1="0" x2="80" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="140" y1="0" x2="140" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="280" y1="0" x2="280" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="150" stroke="#000" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="150" stroke="#000" stroke-width="1"/>
    
    <!-- Row 1: W1 -->
    <rect x="0" y="30" width="800" height="30" fill="#f0f8ff" stroke="#000" stroke-width="1"/>
    <text x="40" y="50" font-family="Arial" font-size="12" text-anchor="middle">W1</text>
    <text x="110" y="50" font-family="Arial" font-size="12" text-anchor="middle">2</text>
    <text x="210" y="50" font-family="Arial" font-size="12" text-anchor="middle">3040 (3'-0" × 4'-0")</text>
    <text x="350" y="50" font-family="Arial" font-size="12" text-anchor="middle">37" × 49"</text>
    <text x="490" y="50" font-family="Arial" font-size="12" text-anchor="middle">2×6</text>
    <text x="630" y="50" font-family="Arial" font-size="11" text-anchor="middle">Vinyl, double-hung, tempered</text>
    
    <!-- Row 2: W2 -->
    <rect x="0" y="60" width="800" height="30" fill="#ffffff" stroke="#000" stroke-width="1"/>
    <text x="40" y="80" font-family="Arial" font-size="12" text-anchor="middle">W2</text>
    <text x="110" y="80" font-family="Arial" font-size="12" text-anchor="middle">3</text>
    <text x="210" y="80" font-family="Arial" font-size="12" text-anchor="middle">3050 (3'-0" × 5'-0")</text>
    <text x="350" y="80" font-family="Arial" font-size="12" text-anchor="middle">37" × 61"</text>
    <text x="490" y="80" font-family="Arial" font-size="12" text-anchor="middle">2×6</text>
    <text x="630" y="80" font-family="Arial" font-size="11" text-anchor="middle">Vinyl, double-hung, egress</text>
    
    <!-- Row 3: W3 -->
    <rect x="0" y="90" width="800" height="30" fill="#f0f8ff" stroke="#000" stroke-width="1"/>
    <text x="40" y="110" font-family="Arial" font-size="12" text-anchor="middle">W3</text>
    <text x="110" y="110" font-family="Arial" font-size="12" text-anchor="middle">1</text>
    <text x="210" y="110" font-family="Arial" font-size="12" text-anchor="middle">6030 (6'-0" × 3'-0")</text>
    <text x="350" y="110" font-family="Arial" font-size="12" text-anchor="middle">73" × 37"</text>
    <text x="490" y="110" font-family="Arial" font-size="12" text-anchor="middle">2×8</text>
    <text x="630" y="110" font-family="Arial" font-size="11" text-anchor="middle">Vinyl, sliding, grids</text>
    
    <!-- Row 4: W4 -->
    <rect x="0" y="120" width="800" height="30" fill="#ffffff" stroke="#000" stroke-width="1"/>
    <text x="40" y="140" font-family="Arial" font-size="12" text-anchor="middle">W4</text>
    <text x="110" y="140" font-family="Arial" font-size="12" text-anchor="middle">2</text>
    <text x="210" y="140" font-family="Arial" font-size="12" text-anchor="middle">2040 (2'-0" × 4'-0")</text>
    <text x="350" y="140" font-family="Arial" font-size="12" text-anchor="middle">25" × 49"</text>
    <text x="490" y="140" font-family="Arial" font-size="12" text-anchor="middle">2×6</text>
    <text x="630" y="140" font-family="Arial" font-size="11" text-anchor="middle">Vinyl, casement</text>
  </g>
  
  <!-- DOOR SCHEDULE TABLE -->
  <g transform="translate(50, 260)">
    <text x="0" y="-10" font-family="Arial" font-size="13" font-weight="bold">DOOR SCHEDULE</text>
    
    <!-- Table header -->
    <rect x="0" y="0" width="800" height="30" fill="#b8860b" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">TAG</text>
    <text x="110" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">QTY</text>
    <text x="210" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">SIZE (W×H)</text>
    <text x="350" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ROUGH OPENING</text>
    <text x="490" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">HEADER SIZE</text>
    <text x="630" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">REMARKS</text>
    
    <!-- Table grid lines -->
    <line x1="80" y1="0" x2="80" y2="90" stroke="#000" stroke-width="1"/>
    <line x1="140" y1="0" x2="140" y2="90" stroke="#000" stroke-width="1"/>
    <line x1="280" y1="0" x2="280" y2="90" stroke="#000" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="90" stroke="#000" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="90" stroke="#000" stroke-width="1"/>
    
    <!-- Row 1: D1 -->
    <rect x="0" y="30" width="800" height="30" fill="#fffacd" stroke="#000" stroke-width="1"/>
    <text x="40" y="50" font-family="Arial" font-size="12" text-anchor="middle">D1</text>
    <text x="110" y="50" font-family="Arial" font-size="12" text-anchor="middle">1</text>
    <text x="210" y="50" font-family="Arial" font-size="12" text-anchor="middle">3068 (3'-0" × 6'-8")</text>
    <text x="350" y="50" font-family="Arial" font-size="12" text-anchor="middle">38" × 82"</text>
    <text x="490" y="50" font-family="Arial" font-size="12" text-anchor="middle">2×6</text>
    <text x="630" y="50" font-family="Arial" font-size="11" text-anchor="middle">Steel, insulated, entry</text>
    
    <!-- Row 2: D2 -->
    <rect x="0" y="60" width="800" height="30" fill="#ffffff" stroke="#000" stroke-width="1"/>
    <text x="40" y="80" font-family="Arial" font-size="12" text-anchor="middle">D2</text>
    <text x="110" y="80" font-family="Arial" font-size="12" text-anchor="middle">5</text>
    <text x="210" y="80" font-family="Arial" font-size="12" text-anchor="middle">2868 (2'-8" × 6'-8")</text>
    <text x="350" y="80" font-family="Arial" font-size="12" text-anchor="middle">34" × 82"</text>
    <text x="490" y="80" font-family="Arial" font-size="12" text-anchor="middle">2×6</text>
    <text x="630" y="80" font-family="Arial" font-size="11" text-anchor="middle">Hollow core, interior</text>
  </g>
  
  <!-- PLAN VIEW WITH CALLOUTS (Bottom) -->
  <g transform="translate(100, 400)">
    <text x="250" y="-10" font-family="Arial" font-size="13" font-weight="bold">FLOOR PLAN - TAG LOCATIONS</text>
    
    <!-- Simplified floor plan -->
    <rect x="0" y="0" width="500" height="150" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Interior walls -->
    <line x1="0" y1="75" x2="500" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="250" y1="0" x2="250" y2="150" stroke="#000" stroke-width="1.5"/>
    
    <!-- Window symbols with tags -->
    <g id="w1-callout">
      <rect x="80" y="-3" width="40" height="6" fill="#87ceeb" stroke="#000" stroke-width="1"/>
      <circle cx="100" cy="0" r="10" fill="#fff" stroke="#4682b4" stroke-width="1.5"/>
      <text x="100" y="4" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">W1</text>
      <!-- Pointer line -->
      <line x1="100" y1="-10" x2="100" y2="-25" stroke="#4682b4" stroke-width="1"/>
      <line x1="100" y1="-25" x2="140" y2="-40" stroke="#4682b4" stroke-width="1"/>
      <text x="145" y="-35" font-family="Arial" font-size="11" fill="#4682b4">See Window</text>
      <text x="145" y="-26" font-family="Arial" font-size="11" fill="#4682b4">Schedule: W1</text>
    </g>
    
    <g id="w2-callout">
      <rect x="380" y="-3" width="40" height="6" fill="#87ceeb" stroke="#000" stroke-width="1"/>
      <circle cx="400" cy="0" r="10" fill="#fff" stroke="#4682b4" stroke-width="1.5"/>
      <text x="400" y="4" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">W2</text>
    </g>
    
    <g id="w3-callout">
      <rect x="-3" y="50" width="6" height="40" fill="#87ceeb" stroke="#000" stroke-width="1"/>
      <circle cx="0" cy="70" r="10" fill="#fff" stroke="#4682b4" stroke-width="1.5"/>
      <text x="0" y="74" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">W3</text>
    </g>
    
    <!-- Door symbols with tags -->
    <g id="d1-callout">
      <line x1="160" y1="75" x2="200" y2="75" stroke="#000" stroke-width="1"/>
      <path d="M 160 75 L 160 115 A 40 40 0 0 0 200 75" fill="none" stroke="#000" stroke-width="1"/>
      <circle cx="180" cy="75" r="10" fill="#fff" stroke="#b8860b" stroke-width="1.5"/>
      <text x="180" y="79" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">D1</text>
      <!-- Pointer line -->
      <line x1="180" y1="85" x2="180" y2="105" stroke="#b8860b" stroke-width="1"/>
      <line x1="180" y1="105" x2="240" y2="125" stroke="#b8860b" stroke-width="1"/>
      <text x="245" y="123" font-family="Arial" font-size="11" fill="#b8860b">See Door</text>
      <text x="245" y="132" font-family="Arial" font-size="11" fill="#b8860b">Schedule: D1</text>
    </g>
    
    <g id="d2-callout">
      <line x1="250" y1="100" x2="250" y2="140" stroke="#000" stroke-width="1"/>
      <path d="M 250 100 L 210 100 A 40 40 0 0 0 250 140" fill="none" stroke="#000" stroke-width="1"/>
      <circle cx="250" cy="120" r="10" fill="#fff" stroke="#b8860b" stroke-width="1.5"/>
      <text x="250" y="124" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">D2</text>
    </g>
    
    <!-- Room labels -->
    <text x="125" y="40" font-family="Arial" font-size="11">LIVING</text>
    <text x="350" y="40" font-family="Arial" font-size="11">BEDROOM</text>
    <text x="125" y="115" font-family="Arial" font-size="11">KITCHEN</text>
  </g>
  
  <!-- Note -->
  <text x="50" y="580" font-family="Arial" font-size="11" font-style="italic">
    Note: Window and door tags on plan view correspond to schedule table above. Verify rough opening sizes before framing.
  </text>
</svg>
