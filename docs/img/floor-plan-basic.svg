<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">FIRST FLOOR PLAN</text>
  <text x="400" y="50" font-family="Arial" font-size="12" text-anchor="middle">Scale: 1/4" = 1'-0"</text>
  
  <!-- Main exterior walls (thick lines) -->
  <rect x="80" y="100" width="640" height="400" fill="none" stroke="#000" stroke-width="4"/>
  <rect x="84" y="104" width="632" height="392" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Interior partition walls (thinner lines) -->
  <line x1="80" y1="300" x2="720" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#000" stroke-width="2"/>
  <line x1="560" y1="300" x2="560" y2="500" stroke="#000" stroke-width="2"/>
  
  <!-- Windows with tags -->
  <g id="window1">
    <rect x="200" y="97" width="80" height="6" fill="#fff" stroke="#000" stroke-width="1"/>
    <line x1="220" y1="100" x2="260" y2="100" stroke="#000" stroke-width="2"/>
    <circle cx="240" cy="80" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="240" y="84" font-family="Arial" font-size="12" text-anchor="middle">W1</text>
  </g>
  
  <g id="window2">
    <rect x="500" y="97" width="80" height="6" fill="#fff" stroke="#000" stroke-width="1"/>
    <line x1="520" y1="100" x2="560" y2="100" stroke="#000" stroke-width="2"/>
    <circle cx="540" cy="80" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="540" y="84" font-family="Arial" font-size="12" text-anchor="middle">W2</text>
  </g>
  
  <g id="window3">
    <rect x="77" y="200" width="6" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
    <line x1="80" y1="220" x2="80" y2="260" stroke="#000" stroke-width="2"/>
    <circle cx="50" cy="240" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="50" y="244" font-family="Arial" font-size="12" text-anchor="middle">W3</text>
  </g>
  
  <!-- Doors with swing arcs and tags -->
  <g id="door1">
    <line x1="240" y1="300" x2="280" y2="300" stroke="#000" stroke-width="1"/>
    <path d="M 240 300 L 240 340 A 40 40 0 0 0 280 300" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="240" y1="300" x2="280" y2="300" stroke="#000" stroke-width="1"/>
    <circle cx="260" cy="280" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="260" y="284" font-family="Arial" font-size="12" text-anchor="middle">D1</text>
  </g>
  
  <g id="door2">
    <line x1="400" y1="360" x2="400" y2="400" stroke="#000" stroke-width="1"/>
    <path d="M 400 360 L 360 360 A 40 40 0 0 0 400 400" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="420" cy="380" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="420" y="384" font-family="Arial" font-size="12" text-anchor="middle">D2</text>
  </g>
  
  <g id="door3">
    <line x1="560" y1="360" x2="560" y2="400" stroke="#000" stroke-width="1"/>
    <path d="M 560 360 L 600 360 A 40 40 0 0 0 560 400" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="580" cy="340" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="580" y="344" font-family="Arial" font-size="12" text-anchor="middle">D3</text>
  </g>
  
  <!-- Section callout -->
  <g id="section-callout">
    <circle cx="400" cy="500" r="15" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="385" y1="500" x2="415" y2="500" stroke="#000" stroke-width="1"/>
    <text x="400" y="497" font-family="Arial" font-size="12" text-anchor="middle">2</text>
    <text x="400" y="507" font-family="Arial" font-size="11" text-anchor="middle">A5.1</text>
  </g>
  
  <!-- Grid lines -->
  <g id="grid-lines">
    <line x1="80" y1="520" x2="80" y2="530" stroke="#000" stroke-width="1"/>
    <circle cx="80" cy="535" r="8" fill="none" stroke="#000" stroke-width="1"/>
    <text x="80" y="539" font-family="Arial" font-size="11" text-anchor="middle">A</text>
    
    <line x1="400" y1="520" x2="400" y2="530" stroke="#000" stroke-width="1"/>
    <circle cx="400" cy="535" r="8" fill="none" stroke="#000" stroke-width="1"/>
    <text x="400" y="539" font-family="Arial" font-size="11" text-anchor="middle">B</text>
    
    <line x1="720" y1="520" x2="720" y2="530" stroke="#000" stroke-width="1"/>
    <circle cx="720" cy="535" r="8" fill="none" stroke="#000" stroke-width="1"/>
    <text x="720" y="539" font-family="Arial" font-size="11" text-anchor="middle">C</text>
  </g>
  
  <!-- Dimension strings -->
  <g id="dimensions">
    <!-- Overall dimension -->
    <line x1="80" y1="70" x2="720" y2="70" stroke="#000" stroke-width="0.5"/>
    <line x1="80" y1="65" x2="80" y2="75" stroke="#000" stroke-width="0.5"/>
    <line x1="720" y1="65" x2="720" y2="75" stroke="#000" stroke-width="0.5"/>
    <text x="400" y="65" font-family="Arial" font-size="11" text-anchor="middle">48'-0"</text>
    
    <!-- Segment dimensions -->
    <line x1="80" y1="560" x2="400" y2="560" stroke="#000" stroke-width="0.5"/>
    <line x1="80" y1="555" x2="80" y2="565" stroke="#000" stroke-width="0.5"/>
    <line x1="400" y1="555" x2="400" y2="565" stroke="#000" stroke-width="0.5"/>
    <text x="240" y="555" font-family="Arial" font-size="12" text-anchor="middle">24'-0"</text>
    
    <line x1="400" y1="560" x2="720" y2="560" stroke="#000" stroke-width="0.5"/>
    <line x1="720" y1="555" x2="720" y2="565" stroke="#000" stroke-width="0.5"/>
    <text x="560" y="555" font-family="Arial" font-size="12" text-anchor="middle">24'-0"</text>
    
    <!-- Vertical dimension -->
    <line x1="750" y1="100" x2="750" y2="500" stroke="#000" stroke-width="0.5"/>
    <line x1="745" y1="100" x2="755" y2="100" stroke="#000" stroke-width="0.5"/>
    <line x1="745" y1="500" x2="755" y2="500" stroke="#000" stroke-width="0.5"/>
    <text x="765" y="305" font-family="Arial" font-size="11" transform="rotate(90 765 305)" text-anchor="middle">32'-0"</text>
  </g>
  
  <!-- Room labels -->
  <text x="200" y="200" font-family="Arial" font-size="14">LIVING ROOM</text>
  <text x="520" y="200" font-family="Arial" font-size="14">BEDROOM 1</text>
  <text x="180" y="400" font-family="Arial" font-size="14">KITCHEN</text>
  <text x="450" y="400" font-family="Arial" font-size="14">DINING</text>
  <text x="600" y="400" font-family="Arial" font-size="14">BATH</text>
</svg>
