<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">WALL FRAMING SECTION</text>
  <text x="400" y="50" font-family="Arial" font-size="12" text-anchor="middle">Typical 2x6 Exterior Wall with Window Opening</text>
  
  <!-- Foundation/Slab -->
  <rect x="50" y="600" width="700" height="80" fill="#d0d0d0" stroke="#000" stroke-width="2"/>
  <text x="400" y="645" font-family="Arial" font-size="11" text-anchor="middle">CONCRETE SLAB</text>
  
  <!-- Bottom Plate (treated) -->
  <rect x="200" y="585" width="400" height="15" fill="#8b6914" stroke="#000" stroke-width="1.5"/>
  <line x1="100" y1="592" x2="180" y2="592" stroke="#000" stroke-width="0.5"/>
  <text x="140" y="596" font-family="Arial" font-size="12" text-anchor="middle">Bottom Plate</text>
  <text x="140" y="606" font-family="Arial" font-size="11" text-anchor="middle">(Treated 2x6)</text>
  
  <!-- Common Studs at 16" O.C. -->
  <g id="studs">
    <!-- Stud 1 -->
    <rect x="200" y="195" width="15" height="390" fill="#d2b48c" stroke="#000" stroke-width="1"/>
    <!-- Stud 2 at 16" -->
    <rect x="280" y="195" width="15" height="390" fill="#d2b48c" stroke="#000" stroke-width="1"/>
    <!-- King stud left -->
    <rect x="340" y="195" width="15" height="390" fill="#d2b48c" stroke="#000" stroke-width="1"/>
    <!-- Jack/Trimmer stud left -->
    <rect x="355" y="330" width="15" height="255" fill="#daa520" stroke="#000" stroke-width="1"/>
    <!-- Jack/Trimmer stud right -->
    <rect x="510" y="330" width="15" height="255" fill="#daa520" stroke="#000" stroke-width="1"/>
    <!-- King stud right -->
    <rect x="525" y="195" width="15" height="390" fill="#d2b48c" stroke="#000" stroke-width="1"/>
    <!-- Stud 3 -->
    <rect x="585" y="195" width="15" height="390" fill="#d2b48c" stroke="#000" stroke-width="1"/>
  </g>
  
  <!-- Cripple studs above header -->
  <rect x="380" y="195" width="15" height="95" fill="#c4a572" stroke="#000" stroke-width="1"/>
  <rect x="420" y="195" width="15" height="95" fill="#c4a572" stroke="#000" stroke-width="1"/>
  <rect x="460" y="195" width="15" height="95" fill="#c4a572" stroke="#000" stroke-width="1"/>
  
  <!-- Cripple studs below sill -->
  <rect x="380" y="530" width="15" height="55" fill="#c4a572" stroke="#000" stroke-width="1"/>
  <rect x="420" y="530" width="15" height="55" fill="#c4a572" stroke="#000" stroke-width="1"/>
  <rect x="460" y="530" width="15" height="55" fill="#c4a572" stroke="#000" stroke-width="1"/>
  
  <!-- Header (double 2x10) -->
  <rect x="355" y="290" width="170" height="20" fill="#8b4513" stroke="#000" stroke-width="1.5"/>
  <rect x="355" y="310" width="170" height="20" fill="#8b4513" stroke="#000" stroke-width="1.5"/>
  <text x="440" y="320" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">(2) 2x10</text>
  
  <!-- Window rough opening -->
  <rect x="370" y="335" width="140" height="190" fill="#b0e0e6" stroke="#0000ff" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="440" y="430" font-family="Arial" font-size="11" fill="#0000ff" text-anchor="middle">WINDOW</text>
  <text x="440" y="445" font-family="Arial" font-size="12" fill="#0000ff" text-anchor="middle">R.O.</text>
  
  <!-- Window sill -->
  <rect x="370" y="525" width="140" height="5" fill="#8b4513" stroke="#000" stroke-width="1"/>
  
  <!-- Double Top Plate -->
  <rect x="200" y="180" width="400" height="7.5" fill="#d2691e" stroke="#000" stroke-width="1.5"/>
  <rect x="200" y="172.5" width="400" height="7.5" fill="#d2691e" stroke="#000" stroke-width="1.5"/>
  <line x1="100" y1="176" x2="180" y2="176" stroke="#000" stroke-width="0.5"/>
  <text x="140" y="180" font-family="Arial" font-size="12" text-anchor="middle">Double Top Plate</text>
  
  <!-- Sheathing -->
  <rect x="190" y="172" width="10" height="428" fill="#e8d5b7" stroke="#000" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="400" x2="180" y2="400" stroke="#000" stroke-width="0.5"/>
  <text x="140" y="404" font-family="Arial" font-size="12" text-anchor="middle">Sheathing</text>
  <text x="140" y="416" font-family="Arial" font-size="11" text-anchor="middle">(OSB/Plywood)</text>
  
  <!-- Blocking at mid-height -->
  <line x1="200" y1="390" x2="600" y2="390" stroke="#8b4513" stroke-width="8"/>
  <line x1="650" y1="390" x2="700" y2="390" stroke="#000" stroke-width="0.5"/>
  <text x="675" y="394" font-family="Arial" font-size="12" text-anchor="middle">Fire Blocking</text>
  
  <!-- Dimension arrows and labels -->
  <!-- 16" O.C. spacing -->
  <g>
    <line x1="207" y1="650" x2="287" y2="650" stroke="#ff0000" stroke-width="1"/>
    <line x1="207" y1="645" x2="207" y2="655" stroke="#ff0000" stroke-width="1"/>
    <line x1="287" y1="645" x2="287" y2="655" stroke="#ff0000" stroke-width="1"/>
    <text x="247" y="665" font-family="Arial" font-size="12" fill="#ff0000" text-anchor="middle">16" O.C.</text>
  </g>
  
  <!-- Wall height -->
  <g>
    <line x1="650" y1="172" x2="650" y2="585" stroke="#ff0000" stroke-width="1"/>
    <line x1="645" y1="172" x2="655" y2="172" stroke="#ff0000" stroke-width="1"/>
    <line x1="645" y1="585" x2="655" y2="585" stroke="#ff0000" stroke-width="1"/>
    <text x="665" y="385" font-family="Arial" font-size="12" fill="#ff0000" transform="rotate(90 665 385)" text-anchor="middle">8'-0" Wall Height</text>
  </g>
  
  <!-- Labels with arrows -->
  <!-- King Stud -->
  <line x1="340" y1="250" x2="310" y2="250" stroke="#000" stroke-width="0.5"/>
  <polygon points="310,250 315,247 315,253" fill="#000"/>
  <text x="300" y="254" font-family="Arial" font-size="11" text-anchor="end">King Stud</text>
  
  <!-- Jack Stud -->
  <line x1="355" y1="450" x2="320" y2="450" stroke="#000" stroke-width="0.5"/>
  <polygon points="320,450 325,447 325,453" fill="#000"/>
  <text x="310" y="454" font-family="Arial" font-size="11" text-anchor="end">Jack/Trimmer</text>
  
  <!-- Cripple Stud -->
  <line x1="380" y1="240" x2="350" y2="220" stroke="#000" stroke-width="0.5"/>
  <polygon points="350,220 355,223 352,228" fill="#000"/>
  <text x="340" y="220" font-family="Arial" font-size="11" text-anchor="end">Cripple Stud</text>
  
  <!-- Header -->
  <line x1="525" y1="300" x2="555" y2="300" stroke="#000" stroke-width="0.5"/>
  <polygon points="555,300 550,297 550,303" fill="#000"/>
  <text x="565" y="304" font-family="Arial" font-size="11">Header</text>
  
  <!-- Sill -->
  <line x1="510" y1="527" x2="540" y2="540" stroke="#000" stroke-width="0.5"/>
  <polygon points="540,540 535,537 537,542" fill="#000"/>
  <text x="545" y="544" font-family="Arial" font-size="11">Sill Plate</text>
  
  <!-- Common Stud -->
  <line x1="280" y1="300" x2="250" y2="280" stroke="#000" stroke-width="0.5"/>
  <polygon points="250,280 255,283 252,288" fill="#000"/>
  <text x="240" y="280" font-family="Arial" font-size="11" text-anchor="end">Common Stud</text>
  <text x="240" y="290" font-family="Arial" font-size="11" text-anchor="end">@ 16" O.C.</text>
</svg>
