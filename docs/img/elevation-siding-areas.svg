<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">FRONT ELEVATION - SIDING AREA CALCULATION</text>
  <text x="400" y="50" font-family="Arial" font-size="12" text-anchor="middle">Scale: 1/4" = 1'-0"</text>
  
  <!-- Grade line -->
  <line x1="50" y1="500" x2="750" y2="500" stroke="#654321" stroke-width="3"/>
  <text x="30" y="505" font-family="Arial" font-size="12">GRADE</text>
  
  <!-- Foundation wall -->
  <rect x="100" y="480" width="600" height="20" fill="#999999" stroke="#000" stroke-width="1"/>
  
  <!-- Main wall -->
  <rect x="100" y="350" width="600" height="130" fill="#e8d5b7" stroke="#000" stroke-width="2"/>
  
  <!-- Gable end -->
  <polygon points="100,350 400,200 700,350" fill="#e8d5b7" stroke="#000" stroke-width="2"/>
  
  <!-- Windows -->
  <g id="window1">
    <rect x="200" y="390" width="80" height="70" fill="#87ceeb" stroke="#000" stroke-width="2"/>
    <line x1="240" y1="390" x2="240" y2="460" stroke="#000" stroke-width="1"/>
    <line x1="200" y1="425" x2="280" y2="425" stroke="#000" stroke-width="1"/>
    <circle cx="240" cy="370" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="240" y="374" font-family="Arial" font-size="12" text-anchor="middle">W1</text>
  </g>
  
  <g id="window2">
    <rect x="520" y="390" width="80" height="70" fill="#87ceeb" stroke="#000" stroke-width="2"/>
    <line x1="560" y1="390" x2="560" y2="460" stroke="#000" stroke-width="1"/>
    <line x1="520" y1="425" x2="600" y2="425" stroke="#000" stroke-width="1"/>
    <circle cx="560" cy="370" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="560" y="374" font-family="Arial" font-size="12" text-anchor="middle">W2</text>
  </g>
  
  <!-- Door -->
  <g id="door">
    <rect x="380" y="410" width="40" height="70" fill="#8b4513" stroke="#000" stroke-width="2"/>
    <circle cx="410" y="450" r="3" fill="#000"/>
    <circle cx="400" cy="390" r="12" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="400" y="394" font-family="Arial" font-size="12" text-anchor="middle">D1</text>
  </g>
  
  <!-- Trim boards -->
  <rect x="98" y="348" width="4" height="132" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <rect x="698" y="348" width="4" height="132" fill="#ffffff" stroke="#000" stroke-width="1"/>
  
  <!-- Dimension arrows and shaded areas -->
  <!-- Width dimension -->
  <g>
    <line x1="100" y1="530" x2="700" y2="530" stroke="#ff0000" stroke-width="1"/>
    <line x1="100" y1="525" x2="100" y2="535" stroke="#ff0000" stroke-width="1"/>
    <line x1="700" y1="525" x2="700" y2="535" stroke="#ff0000" stroke-width="1"/>
    <text x="400" y="550" font-family="Arial" font-size="12" fill="#ff0000" font-weight="bold" text-anchor="middle">48'-0" WIDTH</text>
  </g>
  
  <!-- Wall height dimension -->
  <g>
    <line x1="750" y1="500" x2="750" y2="350" stroke="#ff0000" stroke-width="1"/>
    <line x1="745" y1="500" x2="755" y2="500" stroke="#ff0000" stroke-width="1"/>
    <line x1="745" y1="350" x2="755" y2="350" stroke="#ff0000" stroke-width="1"/>
    <text x="770" y="430" font-family="Arial" font-size="12" fill="#ff0000" font-weight="bold" transform="rotate(90 770 430)" text-anchor="middle">12'-0" PLATE HT</text>
  </g>
  
  <!-- Gable rise dimension -->
  <g>
    <line x1="750" y1="350" x2="750" y2="200" stroke="#0000ff" stroke-width="1"/>
    <line x1="745" y1="350" x2="755" y2="350" stroke="#0000ff" stroke-width="1"/>
    <line x1="745" y1="200" x2="755" y2="200" stroke="#0000ff" stroke-width="1"/>
    <text x="770" y="280" font-family="Arial" font-size="12" fill="#0000ff" font-weight="bold" transform="rotate(90 770 280)" text-anchor="middle">12'-0" GABLE RISE</text>
  </g>
  
  <!-- Shaded area for main wall -->
  <rect x="100" y="350" width="600" height="130" fill="rgba(255,255,0,0.2)" stroke="none"/>
  <text x="400" y="420" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">MAIN WALL AREA</text>
  <text x="400" y="435" font-family="Arial" font-size="12" text-anchor="middle">48'-0" × 12'-0" = 576 SF</text>
  
  <!-- Shaded area for gable -->
  <polygon points="100,350 400,200 700,350" fill="rgba(0,255,0,0.2)" stroke="none"/>
  <text x="400" y="280" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">GABLE AREA</text>
  <text x="400" y="295" font-family="Arial" font-size="12" text-anchor="middle">(48'-0" × 12'-0") ÷ 2 = 288 SF</text>
  
  <!-- Opening deduction callouts -->
  <g id="deductions">
    <!-- Window 1 deduction -->
    <rect x="200" y="390" width="80" height="70" fill="rgba(255,0,0,0.3)" stroke="none"/>
    <text x="240" y="430" font-family="Arial" font-size="11" text-anchor="middle" fill="#990000">-35 SF</text>
    
    <!-- Window 2 deduction -->
    <rect x="520" y="390" width="80" height="70" fill="rgba(255,0,0,0.3)" stroke="none"/>
    <text x="560" y="430" font-family="Arial" font-size="11" text-anchor="middle" fill="#990000">-35 SF</text>
    
    <!-- Door deduction -->
    <rect x="380" y="410" width="40" height="70" fill="rgba(255,0,0,0.3)" stroke="none"/>
    <text x="400" y="450" font-family="Arial" font-size="11" text-anchor="middle" fill="#990000">-20 SF</text>
  </g>
  
  <!-- Calculation summary box -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="250" height="180" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="125" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">AREA CALCULATION</text>
    <line x1="10" y1="25" x2="240" y2="25" stroke="#000" stroke-width="1"/>
    
    <text x="15" y="45" font-family="Arial" font-size="12">Main Wall:</text>
    <text x="235" y="45" font-family="Arial" font-size="12" text-anchor="end">576 SF</text>
    
    <text x="15" y="60" font-family="Arial" font-size="12">Gable Triangle:</text>
    <text x="235" y="60" font-family="Arial" font-size="12" text-anchor="end">+ 288 SF</text>
    
    <line x1="15" y1="65" x2="235" y2="65" stroke="#000" stroke-width="0.5"/>
    
    <text x="15" y="80" font-family="Arial" font-size="12" font-weight="bold">Gross Area:</text>
    <text x="235" y="80" font-family="Arial" font-size="12" font-weight="bold" text-anchor="end">864 SF</text>
    
    <text x="15" y="100" font-family="Arial" font-size="12">Window 1 (3040):</text>
    <text x="235" y="100" font-family="Arial" font-size="12" text-anchor="end">- 35 SF</text>
    
    <text x="15" y="115" font-family="Arial" font-size="12">Window 2 (3040):</text>
    <text x="235" y="115" font-family="Arial" font-size="12" text-anchor="end">- 35 SF</text>
    
    <text x="15" y="130" font-family="Arial" font-size="12">Door (3068):</text>
    <text x="235" y="130" font-family="Arial" font-size="12" text-anchor="end">- 20 SF</text>
    
    <line x1="15" y1="135" x2="235" y2="135" stroke="#000" stroke-width="0.5"/>
    
    <text x="15" y="150" font-family="Arial" font-size="12" font-weight="bold">Net Area:</text>
    <text x="235" y="150" font-family="Arial" font-size="12" font-weight="bold" text-anchor="end">774 SF</text>
    
    <text x="15" y="165" font-family="Arial" font-size="12">Waste (10%):</text>
    <text x="235" y="165" font-family="Arial" font-size="12" text-anchor="end">+ 77 SF</text>
    
    <line x1="15" y1="170" x2="235" y2="170" stroke="#000" stroke-width="1"/>
    
    <text x="15" y="185" font-family="Arial" font-size="11" font-weight="bold">ORDER:</text>
    <text x="235" y="185" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">851 SF (8.5 SQ)</text>
  </g>
  
  <!-- Trim callout -->
  <line x1="100" y1="350" x2="70" y2="320" stroke="#000" stroke-width="0.5"/>
  <polygon points="70,320 75,323 72,328" fill="#000"/>
  <text x="65" y="320" font-family="Arial" font-size="11" text-anchor="end">Corner Trim</text>
</svg>
